[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "patreon-video-scraper"
version = "1.0.0"
description = "Scrape Patreon posts and extract video URLs from Vimeo and YouTube"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["requests>=2.31.0"]

[tool.setuptools]
py-modules = ["patreon_scraper", "api_client", "auth", "config", "utils", "video_extractor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
